[project]
name = "pyside-config"
version = "0.2.0"
description = "Persistent application settings for PySide6: attrs classes stored in QSettings, with a generated settings dialog."
readme = "README.md"
authors = [
    { name = "devduck", email = "frederik.kraemer@dev-duck.dev" }
]
requires-python = ">=3.14"
dependencies = [
    "pyside6>=6.12.0",
    "attrs>=26.1.0",
    "pyside-widgets>=0.4.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
    "ruff>=0.17.1",
]

[tool.uv.sources]
pyside-widgets = { git = "https://github.com/fred-kr/pyside-widgets.git", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
